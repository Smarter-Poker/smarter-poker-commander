# ─────────────────────────────────────────────────────────────────────────────
# LOGIN-BRIDGE PROBE — is the Smarter.Poker -> Club Commander handshake
# actually working in production right now?
#
# 2026-09-03: every Commander login had been failing for days
# (`completeLogin is not defined`), the hub-origin proxy served an app whose
# JS chunks 404'd, and nothing paged. Unit tests guard the source; this guards
# the RUNNING system across the hub rewrite, the commander deploy and Supabase,
# which no single repo's CI can see. scripts/probe-login-bridge.mjs runs a
# credential-less structural leg every time, and a signed-in leg when the
# PROBE_EMAIL / PROBE_PASSWORD secrets are set (a Commander owner test
# account). On failure it files ONE self-updating issue with the full report.
#
# This is CI-side monitoring, not application logic; it needs no database and
# runs against public URLs, which is why it is a GitHub schedule and not an
# Open Claw job.
# ─────────────────────────────────────────────────────────────────────────────
name: Login Bridge Probe

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
  workflow_dispatch:
  # Also run on merge to main so a bad deploy is caught within minutes.
  push:
    branches: [main]
    paths:
      - 'pages/commander/login.js'
      - 'pages/auth/**'
      - 'pages/api/auth/**'
      - 'pages/api/check-subscription.js'
      - 'pages/api/health.js'
      - 'vendor/commander-shared/src/lib/commander/**'
      - 'next.config.js'
      - 'middleware.ts'
      - 'scripts/probe-login-bridge.mjs'
      # The signed-in staff header census (e2e job) re-runs when its spec,
      # the header registry or this workflow changes.
      - 'tests/e2e/staff-headers.spec.ts'
      - 'src/components/commander/shared/pageHeaders.js'
      # The player page census and the business-date check (same job).
      - 'tests/e2e/player-pages.spec.ts'
      - 'tests/e2e/business-date.spec.ts'
      - 'tests/e2e/probeSession.ts'
      - 'vendor/commander-shared/src/lib/commander/businessDate.js'
      - 'src/lib/commander/venueTimeZone.js'
      - 'pages/api/reports/daily.js'
      - '.github/workflows/login-bridge-probe.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: login-bridge-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Handshake is working in production
    runs-on: ubuntu-latest
    # 10 -> 30 (2026-11-28): the push-only wait below is bounded at 10-25 min
    # (60 tries x up to 25 s) and is MEANT to run out when Vercel skips the
    # build (docs/tests/workflow-only merges), then probe what is live. With a
    # 10-minute job limit the job was cancelled inside the wait instead, so
    # the probe never ran and the run ended "cancelled" (run 46126200298).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for the production deploy to settle (push trigger only)
        if: github.event_name == 'push'
        # A blind sleep raced the deploy: on 2026-09-04 the probe ran 4 minutes
        # after the merge that added /api/staff-session/renew, the build was
        # still going, the route 404'd and a false incident was filed. Wait for
        # /api/health to report THIS commit instead (bounded: Vercel skips the
        # build when only docs/scripts changed, so the version may never move).
        run: |
          want="${GITHUB_SHA:0:8}"
          for i in $(seq 1 60); do
            got=$(curl -s --max-time 15 https://commander.smarter.poker/api/health | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$got" = "$want" ]; then echo "production serves $got"; exit 0; fi
            sleep 10
          done
          echo "::warning::production still serves ${got:-?} after 10 min (wanted $want) - probing what is live"
      - name: Probe
        id: probe
        continue-on-error: true
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
        run: node scripts/probe-login-bridge.mjs

      - name: File or refresh the incident issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = 'Login bridge probe FAILING - Commander sign-in may be broken in production';
            const body = [
              `**Run:** ${runUrl}`,
              `**Trigger:** ${context.eventName}`,
              '',
              process.env.REPORT || '(no report captured)',
              '',
              'Auto-filed by `.github/workflows/login-bridge-probe.yml`. It re-checks every 30 minutes and closes this issue itself when the probe passes again.',
              'Runbook: `docs/runbooks/login-bridge.md`.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: 'login-bridge-probe', state: 'open', per_page: 1 });
            if (open.data.length) {
              await github.rest.issues.update({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['login-bridge-probe', 'incident'] });
            }

      - name: Close the incident issue when green again
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: 'login-bridge-probe', state: 'open', per_page: 5 });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `Probe passed again at ${new Date().toISOString()} (run https://github.com/${owner}/${repo}/actions/runs/${context.runId}). Closing.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }

      - name: Fail the run if the probe failed
        if: steps.probe.outcome == 'failure'
        run: exit 1

  e2e:
    name: Handshake works in a real browser
    # Pinned 2026-11-27: GitHub moved ubuntu-latest to Ubuntu 26.04 (rolled out
    # Oct 19 - Nov 19). Playwright 1.50-1.60 has no browser builds for 26.04, so
    # "Install Chromium" failed on every run from 2026-11-13 and this browser leg
    # never executed. Move to ubuntu-26.04 together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    # 15 -> 50 (2026-11-28): the job now also opens every staff page signed in,
    # after the same bounded deploy wait (up to 25 min) as the probe job.
    # 50 -> 80 (2026-11-28): plus every World Hub player page at two widths
    # (30 min cap) and the business-date read.
    timeout-minutes: 80
    needs: probe
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Wait for the production deploy to settle (push trigger only)
        if: github.event_name == 'push'
        # A blind sleep raced the deploy: on 2026-09-04 the probe ran 4 minutes
        # after the merge that added /api/staff-session/renew, the build was
        # still going, the route 404'd and a false incident was filed. Wait for
        # /api/health to report THIS commit instead (bounded: Vercel skips the
        # build when only docs/scripts changed, so the version may never move).
        run: |
          want="${GITHUB_SHA:0:8}"
          for i in $(seq 1 60); do
            got=$(curl -s --max-time 15 https://commander.smarter.poker/api/health | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$got" = "$want" ]; then echo "production serves $got"; exit 0; fi
            sleep 10
          done
          echo "::warning::production still serves ${got:-?} after 10 min (wanted $want) - probing what is live"
      - name: Playwright - tests/e2e/login-bridge.spec.ts against production
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: https://commander.smarter.poker
          PLAYWRIGHT_HUB_ORIGIN: https://smarter.poker
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
        run: npx playwright test tests/e2e/login-bridge.spec.ts --reporter=line
      # 2026-11-28: signed-in live proof of the #SmarterDesign headers. Signs in
      # as the probe account and opens every staff route in
      # src/components/commander/shared/pageHeaders.js that is neither PIN-gated
      # nor a redirect, asserting one [data-page-image-header] and exactly one
      # [data-page-help], with a screenshot of each page. Runs even when the
      # bridge spec above failed, so one red leg never hides the other.
      - name: "Playwright - every staff page shows its #SmarterDesign header (signed in)"
        id: staff_headers
        if: ${{ !cancelled() }}
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: https://commander.smarter.poker
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          # true on the canonical repository only: there a missing secret is a
          # failure (the signed-in check silently stopped), on a fork a notice.
          PROBE_SECRETS_REQUIRED: ${{ github.repository == 'Smarter-Poker/smarter-poker-commander' }}
        run: |
          if [ -z "$PLAYWRIGHT_TEST_EMAIL" ] || [ -z "$PLAYWRIGHT_TEST_PASSWORD" ]; then
            if [ "$PROBE_SECRETS_REQUIRED" = "true" ]; then
              echo "::error title=Staff header census cannot run::PROBE_EMAIL / PROBE_PASSWORD are missing on the canonical repository."
              echo "### Staff header census: FAILED (PROBE_EMAIL / PROBE_PASSWORD missing)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::notice title=Staff header census skipped::PROBE_EMAIL / PROBE_PASSWORD are not set on this repository, so the signed-in staff header pass did not run."
            echo "### Staff header census: SKIPPED (PROBE_EMAIL / PROBE_PASSWORD not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx playwright test tests/e2e/staff-headers.spec.ts --project=chromium --reporter=line
          echo "### Staff header census: PASSED ($(ls test-results/staff-headers | wc -l) pages, screenshots in the staff-header-screenshots artifact)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload staff page screenshots
        if: ${{ !cancelled() && steps.staff_headers.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: staff-header-screenshots
          path: test-results/staff-headers/
          if-no-files-found: ignore
          retention-days: 14
      # 2026-11-28: the World Hub player pages (pages/hub/commander/**, read
      # from the hub source checked out here, so a new page is covered on the
      # next run) signed in as the probe at 393px and 1280px, and the venue
      # business date read back from production. Both run even when an
      # earlier leg failed, and neither retries.
      # Playwright empties test-results/ at the start of every run, so each
      # census uploads its screenshots before the next spec starts.
      - name: Check out the World Hub player page list
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          repository: Smarter-Poker/Smarter-Poker-World-Hub
          ref: main
          path: world-hub
          sparse-checkout: pages/hub/commander
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: "Playwright - every World Hub player page shows its headers (signed in)"
        id: player_pages
        if: ${{ !cancelled() }}
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: https://commander.smarter.poker
          PLAYWRIGHT_HUB_ORIGIN: https://smarter.poker
          HUB_COMMANDER_PAGES_DIR: ${{ github.workspace }}/world-hub/pages/hub/commander
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_SECRETS_REQUIRED: ${{ github.repository == 'Smarter-Poker/smarter-poker-commander' }}
        run: |
          if [ -z "$PLAYWRIGHT_TEST_EMAIL" ] || [ -z "$PLAYWRIGHT_TEST_PASSWORD" ]; then
            if [ "$PROBE_SECRETS_REQUIRED" = "true" ]; then
              echo "::error title=Player page census cannot run::PROBE_EMAIL / PROBE_PASSWORD are missing on the canonical repository."
              echo "### Player page census: FAILED (PROBE_EMAIL / PROBE_PASSWORD missing)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::notice title=Player page census skipped::PROBE_EMAIL / PROBE_PASSWORD are not set on this repository, so the signed-in player page pass did not run."
            echo "### Player page census: SKIPPED (PROBE_EMAIL / PROBE_PASSWORD not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx playwright test tests/e2e/player-pages.spec.ts --project=chromium --retries=0 --reporter=line 2>&1 | tee player-pages.log
          status=${PIPESTATUS[0]}
          line=$(grep -o '\[player-pages\] visited.*' player-pages.log | tail -1)
          if [ -n "$line" ]; then echo "::notice title=Player page census::${line}"; fi
          if [ "$status" -ne 0 ]; then echo "### Player page census: FAILED. ${line}" >> "$GITHUB_STEP_SUMMARY"; exit "$status"; fi
          echo "### Player page census: PASSED. ${line} ($(ls test-results/player-pages | wc -l) screenshots in the player-page-screenshots artifact)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload player page screenshots
        if: ${{ !cancelled() && steps.player_pages.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: player-page-screenshots
          path: test-results/player-pages/
          if-no-files-found: ignore
          retention-days: 14
      - name: Playwright - the business date is the venue-local date (signed in, read-only)
        id: business_date
        if: ${{ !cancelled() }}
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: https://commander.smarter.poker
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_SECRETS_REQUIRED: ${{ github.repository == 'Smarter-Poker/smarter-poker-commander' }}
        run: |
          if [ -z "$PLAYWRIGHT_TEST_EMAIL" ] || [ -z "$PLAYWRIGHT_TEST_PASSWORD" ]; then
            if [ "$PROBE_SECRETS_REQUIRED" = "true" ]; then
              echo "::error title=Business date check cannot run::PROBE_EMAIL / PROBE_PASSWORD are missing on the canonical repository."
              exit 1
            fi
            echo "::notice title=Business date check skipped::PROBE_EMAIL / PROBE_PASSWORD are not set on this repository."
            exit 0
          fi
          npx playwright test tests/e2e/business-date.spec.ts --project=chromium --retries=0 --reporter=line 2>&1 | tee business-date.log
          status=${PIPESTATUS[0]}
          line=$(grep -o '\[business-date\].*' business-date.log | tail -1)
          if [ -n "$line" ]; then echo "::notice title=Business date::${line}"; fi
          if [ "$status" -ne 0 ]; then echo "### Business date: FAILED. ${line}" >> "$GITHUB_STEP_SUMMARY"; exit "$status"; fi
          echo "### Business date: PASSED. ${line}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-bridge-e2e-traces
          path: test-results/
          retention-days: 7
