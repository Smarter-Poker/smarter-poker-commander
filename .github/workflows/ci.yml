name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      driftlog: ${{ steps.drift.outputs.log }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Agent policy integrity and delivery scenarios
        run: |
          node docs/agent-policy/agent-policy.mjs check
          node --test docs/agent-policy/agent-policy.test.mjs

      - name: Build cost controls
        run: node --test tests/vercel-build-queue.test.mjs

      # Vendor drift guard — ported from World Hub build-safety-gate CHECK 14.
      # Runs BEFORE npm install (dependency-free static analysis). Guards the
      # two vendoring-drift classes behind the Aug 2026 prod incidents:
      #   A. module.exports/require() inside the type:module vendor package
      #      — the file silently exports NOTHING (parseBlindStructure,
      #      home-games/rpcBridge).
      #   B. Importing a vendor path directly when a real local src/ override
      #      carries the fix — the forgeable-vendor-auth bug entered this repo
      #      exactly that way.
      # Output is captured into a step output so notify-failure can embed it
      # in the failure issue (private-repo run logs are unreachable from the
      # MCP tooling agents use to verify pushes).
      - name: Vendor drift guard (CJS-under-ESM + override bypass)
        id: drift
        run: |
          set +e
          OUT=$(node scripts/check-vendor-drift.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo 'log<<DRIFT_EOF'
            echo "$OUT" | head -c 60000
            echo ''
            echo 'DRIFT_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $CODE
      # Vendor <-> upstream ratchet (2026-09-04). vendor/commander-shared is a
      # copy of Smarter-Poker/commander-shared; a vendor file that differs
      # from upstream main and is not in scripts/ci/vendor-upstream-divergence.json
      # fails here. Land the change upstream first, then sync. CLAUDE.md 3.5.
      # The ratchet clones the PRIVATE upstream repo, which GITHUB_TOKEN cannot
      # see (it is scoped to this repo). Mint an App installation token scoped
      # to commander-shared - the same App agent-open-pr / agent-autopilot use,
      # installed on all seven repos. GH_PAT is the fallback; it FAILED the
      # clone on 2026-09-04 (first run of this step), which is why the App is
      # first here too.
      - name: Mint an App token that can read commander-shared
        id: upstream-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          owner: Smarter-Poker
          repositories: commander-shared
      - name: Vendor <-> upstream ratchet
        env:
          GH_PAT: ${{ steps.upstream-token.outputs.token || secrets.GH_PAT }}
        run: node scripts/check-vendor-upstream-sync.mjs
      - name: Install
        run: npm install --legacy-peer-deps
      # BLOCKING. `next lint` was advisory and red for months (deleted 2026-09-04),
      # which is how `completeLogin is not defined` sat in pages/commander/login.js
      # while every production login failed with that exact ReferenceError
      # (2026-09-03). This step runs ONE rule - no-undef - over pages/, src/,
      # vendor/ and scripts/. A hit is a ReferenceError waiting for a user.
      - name: Undefined identifiers (blocking)
        run: npm run lint:undef
      # `next lint` (advisory) was DELETED 2026-09-04: it had no ESLint config,
      # prompted interactively, and could not fail. Law 3.1: fix it or delete
      # it, never leave it advisory. The step above now also carries ESLint's
      # bug-class rules (see eslint.undef.config.mjs).
      # 2026-07-27 (audit hardening): the test step used to be advisory while
      # the repo contained no unit tests at all, so it could never fail. There
      # is now a real suite (ICM payout math, rate-limit identity, staff-session
      # forgery, the login-bridge law) and this step gates on it.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          SUPABASE_JWT_SECRET: dummy
      # 2026-09-04: the login-bridge probe runs against THIS commit before it
      # can merge. `next start` the build just made (no secrets at all), then
      # the structural leg in local mode: the login chunk's free
      # `completeLogin(` call, the bridge, the SSO page, the API contracts,
      # health. That is the 2026-09-03 outage caught at pull-request time
      # instead of by a player. Production-only rows (hub rewrite,
      # ingest, secrets present) are skipped or warnings here; the scheduled
      # production probe still owns those. A Vercel preview URL cannot be used
      # for this: previews are SSO-protected on this project.
      - name: Start the build and probe it (login-bridge, local mode)
        env:
          PROBE_LOCAL: '1'
          PROBE_COMMANDER_ORIGIN: http://127.0.0.1:3199
        run: |
          npx next start -p 3199 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 http://127.0.0.1:3199/api/health > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -sf --max-time 3 http://127.0.0.1:3199/api/health > /dev/null; then
            echo "::error::next start did not answer /api/health in 30s"; cat /tmp/next-start.log; exit 1
          fi
          node scripts/probe-login-bridge.mjs

  # Auto-file (or refresh) a GitHub Issue when CI fails on main — ported from
  # World Hub's Build Safety Gate. Private-repo Actions results are otherwise
  # invisible to the MCP tooling agents use to verify a push landed green.
  # Detail goes in the issue BODY (issues.update) because that tooling can
  # read bodies but not comments.
  notify-failure:
    name: Failure Notification
    needs: [build]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh GitHub Issue on Failure
        uses: actions/github-script@v7
        env:
          DRIFT_LOG: ${{ needs.build.outputs.driftlog }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);

            // Per-job / per-step status so the issue body is self-sufficient.
            let stepReport = '';
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: context.runId, per_page: 20
              });
              for (const job of jobs.data.jobs) {
                stepReport += `\n**Job: ${job.name}** — ${job.conclusion || job.status}\n`;
                for (const s of (job.steps || [])) {
                  if (s.conclusion && s.conclusion !== 'success' && s.conclusion !== 'skipped') {
                    stepReport += `- FAILED STEP: ${s.name}\n`;
                  }
                }
              }
            } catch (e) {
              stepReport = `\n(step status unavailable: ${e.message})\n`;
            }

            const driftLog = process.env.DRIFT_LOG || '';
            const driftSection = driftLog.trim()
              ? `\n### Vendor drift guard output\n\n\`\`\`\n${driftLog.slice(0, 50000)}\n\`\`\`\n`
              : '';

            const issues = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure',
              state: 'open',
              per_page: 1
            });

            const priorNote = issues.data.length > 0
              ? `\n_Earlier failures on this issue were replaced by this latest report (see issue history/comments for prior runs)._\n`
              : '';

            const body = `## CI Failure (latest)\n\n**Commit:** \`${sha}\`\n**Run:** [View details](${runUrl})\n${stepReport}${driftSection}${priorNote}\nAuto-created by the CI pipeline. Close when resolved.`;

            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner, repo,
                issue_number: issues.data[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `CI failed on main — ${new Date().toISOString().split('T')[0]}`,
                body,
                labels: ['ci-failure']
              });
            }
