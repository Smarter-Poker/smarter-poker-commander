<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    
    body {
      background-color: #111827; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    .modal-container {
      position: relative;
      width: 600px; 
      height: 480px; 
      background-image: url('file:///Users/smarter.poker/.gemini/antigravity/brain/d91b8ea2-567b-4029-afb9-0acac78ea587/upgrade_modal_bg.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dynamic-text-area {
      position: absolute;
      top: 44.5%; 
      left: 10%;
      right: 10%;
      text-align: center;
      color: #FFFFFF; /* Pure White */
      font-size: 15px;
      line-height: 1.6;
      text-transform: capitalize;
      letter-spacing: 0.5px;
      font-weight: 600; 
    }

    .tier-name {
      color: #60A5FA; /* Light Blue */
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="modal-container">
    <div class="dynamic-text-area">
      Member Import Requires An Upgrade To<br/>
      The <span class="tier-name">Home Game</span> Plan $99 Per Month.
    </div>
  </div>
</body>
</html>
